# Publishes the app to GitHub Pages (free hosting, HTTPS — required for
# camera access) on every push to main, by pushing the built site to the
# `gh-pages` branch. Creating that branch auto-enables Pages the first time;
# if the site ever stops updating, check Settings → Pages → Source is
# "Deploy from a branch: gh-pages / (root)".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (served under /<repo>/ on project Pages)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
